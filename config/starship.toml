# powerlevel10k-style prompt: connected powerline blocks, icons, two lines.
# Colours are terminal palette names, so they follow the Omarchy theme.
# Needs a Nerd Font (ghostty is set to JetBrainsMono Nerd Font).

add_newline = true
command_timeout = 500

format = """
[](bright-black)$os$username[](fg:bright-black bg:blue)$directory[](fg:blue bg:green)$git_branch$git_commit$git_status[](fg:green bg:purple)$nodejs$python$rust$golang$java$docker_context[](purple)$cmd_duration
$status$jobs$character"""

right_format = "$battery$time"

# ── OS icon ──────────────────────────────────────────────
[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:bright-black fg:white"

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[username]
disabled = true

# ── folder ───────────────────────────────────────────────
[directory]
format = "[ $path ]($style)"
style = "bg:blue fg:black bold"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bg:blue fg:black"
repo_root_style = "bg:blue fg:black bold"
repo_root_format = "[ $repo_root$path ]($style)[$read_only]($read_only_style)"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = "󰝚 Music"
"Pictures" = " Pictures"
"Videos" = " Videos"
"Work" = " Work"
".config" = " .config"

# ── git ──────────────────────────────────────────────────
[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "bg:green fg:black bold"

[git_commit]
format = "[$hash ]($style)"
style = "bg:green fg:black"
only_detached = false
commit_hash_length = 7

[git_status]
format = "([ $ahead_behind$conflicted$staged$modified$renamed$deleted$untracked$stashed]($style))"
style = "bg:green fg:black"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
conflicted = "~${count} "
staged = "✚${count} "
modified = "!${count} "
renamed = "»${count} "
deleted = "✖${count} "
untracked = "?${count} "
stashed = "≡${count} "

[git_state]
format = "[ $state $progress_current/$progress_total ]($style)"
style = "bg:green fg:black bold"

# ── languages, only inside such a project ────────────────
[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "bg:purple fg:white"
[python]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "bg:purple fg:white"
[rust]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "bg:purple fg:white"
[golang]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "bg:purple fg:white"
[java]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "bg:purple fg:white"
[docker_context]
format = "[ $symbol$context ]($style)"
symbol = " "
style = "bg:purple fg:white"

# ── how long the last command took ───────────────────────
[cmd_duration]
min_time = 3000
format = " [󱦟 $duration]($style)"
style = "yellow"

# ── line 2 ───────────────────────────────────────────────
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "󰅙 "
style = "red bold"
map_symbol = false

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "blue bold"
number_threshold = 1

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"

# ── right side ───────────────────────────────────────────
[battery]
charging_symbol = "󰂄 "
discharging_symbol = "󰁿 "
full_symbol = "󰁹 "
format = "[$symbol$percentage]($style) "
disabled = false
[[battery.display]]
threshold = 25
style = "red bold"
[[battery.display]]
threshold = 100
style = "dimmed white"


[time]
disabled = false
format = "[](bright-black)[󰅐 $time ]($style)"
time_format = "%H:%M"
style = "bg:bright-black fg:white"
